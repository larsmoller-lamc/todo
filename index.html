<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnevangen 35 – opgaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --moss:#1C3A2A; --leaf:#3E7D4F; --fern:#5E9B6B; --sage:#B9D4B2; --mist:#EEF4EA; --paper:#FFFFFF;
  --bg:var(--mist); --surface:var(--paper); --surface-2:#F6F9F3; --line:#D6E3D1;
  --text:var(--moss); --text-2:#587060; --accent:var(--leaf); --accent-ink:#FFFFFF;
  --warn:#C77B2B; --done:#8EA893;
  --p1:#9B3D6B; --p2:#3B6EA8; --p3:#8A93A0;
  --r:14px; --r-s:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#101A14; --surface:#172419; --surface-2:#1E2D22; --line:#2B3F31;
  --text:#E6EFE3; --text-2:#9DB3A3; --accent:#6DB37D; --accent-ink:#0E1A12; --sage:#2E4A38; --done:#5C7363;
  --p1:#C9679C; --p2:#6FA0DB; --p3:#A3ADB9;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101A14; --surface:#172419; --surface-2:#1E2D22; --line:#2B3F31;
  --text:#E6EFE3; --text-2:#9DB3A3; --accent:#6DB37D; --accent-ink:#0E1A12; --sage:#2E4A38; --done:#5C7363;
  --p1:#C9679C; --p2:#6FA0DB; --p3:#A3ADB9;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.kpi b,.ring text,.tabs button{font-family:Outfit,Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.datewrap{position:relative}
.datebtn{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface);cursor:pointer}
.datebtn.blank{color:var(--text-2)}
.dateclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--text-2);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}
.dp{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.15);padding:12px;width:272px;display:none}
.dp.show{display:block}
.dp .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp .top b{font-family:Outfit,Inter,sans-serif;font-size:15px;text-transform:capitalize}
.dp .top button{border:0;background:var(--surface-2);border-radius:999px;width:30px;height:30px;cursor:pointer;font-size:16px}
.dp .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp .wd{font-size:11px;font-weight:700;color:var(--text-2);padding:4px 0}
.dp .d{border:0;background:none;border-radius:8px;height:32px;cursor:pointer;font-weight:600;font-size:13px}
.dp .d:hover{background:var(--surface-2)}
.dp .d.out{color:var(--text-2);opacity:.45}
.dp .d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dp .d.sel{background:var(--accent);color:var(--accent-ink)}
.dp .foot{display:flex;justify-content:space-between;margin-top:8px}
.dp .foot button{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 4px}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
header h1 small{display:block;font-size:14px;font-weight:600;color:var(--text-2)}
.mode{font-size:13px;color:var(--text-2);text-align:right;white-space:nowrap}
.mode b{color:var(--accent)}

/* Hurtig tilføjelse */
.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:18px;box-shadow:0 1px 0 rgba(28,58,42,.04)}
.add .row{display:flex;gap:8px}
.add input[type=text]{flex:1;border:0;background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;font-size:17px;font-weight:600;min-width:0}
.add input[type=text]:focus{outline:2px solid var(--accent);outline-offset:0}
.add .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.add select,.add .prio{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.add .prio{display:inline-flex;gap:0;padding:0;overflow:hidden}
.add .prio button{border:0;background:none;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--text-2)}
.add .prio button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.add .prio button[data-p="1"][aria-pressed=true]{background:var(--p1);color:#fff}
.add .prio button[data-p="2"][aria-pressed=true]{background:var(--p2);color:#fff}
.add .prio button[data-p="3"][aria-pressed=true]{background:var(--p3);color:#fff}
.add .hint{font-size:13px;color:var(--text-2);margin-left:auto}
.add .hint code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
textarea#bulk{display:none;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px;min-height:110px;background:var(--surface-2);resize:vertical}
.add.bulk textarea#bulk{display:block}
.add.bulk .row{display:none}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-s);padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Filtre */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-2)}
.seg button[aria-pressed=true]{background:var(--sage);color:var(--text)}
.count{margin-left:auto;font-size:13px;color:var(--text-2)}

/* Liste */
.group{margin-bottom:22px}
.group h2{font-size:14px;font-weight:800;color:var(--text-2);margin:0 0 6px 4px;display:flex;justify-content:space-between}
.task{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc,var(--line));border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.task.p1{--pc:var(--p1)} .task.p2{--pc:var(--p2)} .task.p3{--pc:var(--p3)}
.task.done{--pc:var(--done)}
.group h2.p1{--pc:var(--p1)} .group h2.p2{--pc:var(--p2)} .group h2.p3{--pc:var(--p3)}
.group h2[class] span:first-child{color:var(--pc)}
.task .head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.task .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--pc,var(--fern));background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.task.done .check{background:var(--done);border-color:var(--done)}
.task .check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.task.done .check svg{opacity:1}
.task .title{font-weight:700;min-width:0;overflow-wrap:anywhere}
.task.done .title{color:var(--text-2);text-decoration:line-through;text-decoration-color:var(--done)}
.task .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-2);flex-wrap:wrap;justify-content:flex-end}
.tag{border-radius:999px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.help{background:#FFF1E2;border-color:#F0C9A0;color:var(--warn);font-weight:700}
.tag.prio{border-color:var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);font-weight:700}
.tag.note::before{content:"✎ "}
.task .body{display:none;padding:0 12px 12px;border-top:1px dashed var(--line);background:var(--surface-2)}
.task.open .body{display:block}
.body .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.body label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:4px}
.body select,.body input,.body textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface)}
.body textarea{min-height:80px;resize:vertical;grid-column:1/-1}
.body .chk{display:flex;align-items:center;gap:8px;grid-column:1/-1;font-weight:600}
.body .chk input{width:auto}
.body .actions{display:flex;gap:8px;margin-top:10px;justify-content:space-between}
.body .danger{background:none;border:0;color:var(--warn);cursor:pointer;font-weight:600}
.empty{padding:40px 12px;text-align:center;color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--moss);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* Faner */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;font-weight:700;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed=true]{color:var(--text);border-bottom-color:var(--accent)}
body[data-tab=stats] #add,body[data-tab=stats] .filters,body[data-tab=stats] #list{display:none}
body[data-tab=list] #stats{display:none}

/* Statistik */
#stats{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.kpi span{font-size:12px;color:var(--text-2);font-weight:700}
.kpi.bad b{color:var(--p1)}
.ring{width:56px;height:56px;display:block;margin:-6px auto 0}
.ring circle{fill:none;stroke-width:8} .ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-size:17px;font-weight:800;fill:var(--text)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--text-2)}
.card .sub{margin:-6px 0 12px;font-size:12px;color:var(--text-2)}
.card .muted{color:var(--text-2);font-size:14px}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:600}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.kv{display:grid;gap:8px} .kv div{display:flex;justify-content:space-between;font-size:14px;font-weight:600} .kv b{font-weight:800}
.kv .bad{color:var(--p1)}
.hbars{display:grid;gap:6px}
.hbar{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:600;cursor:pointer;background:none;border:0;padding:4px 0;width:100%;text-align:left;color:var(--text)}
.hbar:hover .bar i{opacity:.8}
.hbar .bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hbar small{color:var(--text-2);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:var(--r-s);padding:10px;text-align:left;cursor:pointer;background:var(--surface-2);color:var(--text);min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:13px;line-height:1.2} .tile span{font-size:12px;color:var(--text-2);font-weight:700}
.tile.clear{opacity:.55}
.chart{width:100%;height:auto;display:block}
.chart .b-add{fill:var(--sage)} .chart .b-done{fill:var(--accent)}
.chart .v{font-size:11px;fill:var(--text-2);text-anchor:middle;font-weight:700} .chart .l{font-size:11px;fill:var(--text-2);text-anchor:middle} .chart .axis{stroke:var(--line)}
.old{display:grid;gap:8px} .old div{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;align-items:baseline} .old small{color:var(--text-2);white-space:nowrap;font-weight:600}
.old .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
@media (max-width:520px){ .cards{grid-template-columns:1fr} .hbar{grid-template-columns:110px 1fr auto} .kpis{grid-template-columns:repeat(3,1fr)} }
@media (max-width:520px){ .task .head{grid-template-columns:auto 1fr} .task .meta{grid-column:2;justify-content:flex-start} .body .grid{grid-template-columns:1fr} header{flex-direction:column;align-items:flex-start} .mode{text-align:left} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body data-tab="list">
<div class="wrap">
  <header>
    <h1>Arnevangen 35<small>Opgaver i huset</small></h1>
    <div class="mode" id="mode"></div>
  </header>

  <div class="tabs" id="tabs" role="tablist">
    <button data-tab="list" aria-pressed="true">Liste</button><button data-tab="stats" aria-pressed="false">Statistik</button>
  </div>

  <section class="add" id="add" aria-label="Ny opgave">
    <div class="row">
      <input type="text" id="newTitle" placeholder="Ny opgave – fx: Male loft @køkken #maler !høj" autocomplete="off">
      <button class="btn" id="addBtn">Tilføj</button>
    </div>
    <textarea id="bulk" placeholder="Én opgave pr. linje. Samme @sted, #kategori og !prio-koder virker på hver linje.&#10;Male loft @køkken #maler&#10;Skifte pakning i bruser @bad soveværelse #vvs"></textarea>
    <div class="opts">
      <select id="newSted" aria-label="Sted"></select>
      <select id="newKat" aria-label="Kategori"></select>
      <div class="prio" id="newPrio" role="group" aria-label="Prioritet">
        <button data-p="1" aria-pressed="false">Høj</button><button data-p="2" aria-pressed="true">Normal</button><button data-p="3" aria-pressed="false">Lav</button>
      </div>
      <button class="btn ghost" id="bulkToggle">Flere ad gangen</button>
      <button class="btn" id="bulkAdd" style="display:none">Tilføj alle</button>
      <span class="hint">Enter tilføjer · <code>@sted</code> <code>#kategori</code> <code>!høj</code></span>
    </div>
  </section>

  <div class="filters">
    <div class="seg" id="statusSeg"><button data-s="aaben" aria-pressed="true">Åbne</button><button data-s="udfoert" aria-pressed="false">Udførte</button><button data-s="alle" aria-pressed="false">Alle</button></div>
    <select id="fSted"><option value="">Alle steder</option></select>
    <select id="fKat"><option value="">Alle kategorier</option></select>
    <select id="fPrio"><option value="">Alle prioriteter</option><option value="1">Høj</option><option value="2">Normal</option><option value="3">Lav</option></select>
    <select id="fHelp"><option value="">Alle</option><option value="1">Kræver hjælp</option></select>
    <select id="sortBy"><option value="sted">Sortér: sted</option><option value="prio">Sortér: prioritet</option><option value="frist">Sortér: frist</option><option value="nyeste">Sortér: nyeste</option></select>
    <span class="count" id="count"></span>
  </div>

  <main id="list"></main>
  <section id="stats" aria-label="Statistik"></section>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="dp" id="dp" role="dialog" aria-label="Vælg dato"></div>

<script src="config.js"></script>
<script>
/* Konfiguration ligger i config.js (window.FIREBASE). Mangler filen, eller er apiKey tom, kører appen i lokal tilstand. */
const FIREBASE = Object.assign({ apiKey: "", collection: "opgaver", requireLogin: true, allowedEmail: "" }, window.FIREBASE || {});

const STEDER = ["Entré","Gang","Alrum","Køkken","Stue","Trappe","Repos","Bryggers","Soveværelse","Bad soveværelse","Carls værelse","Frederiks værelse","Bad Frederik","Gæsteværelse","Williams værelse","Bad William","Hus","Have","Hobbyrum","Garage","Terrasse tag","Terrasse","Pool","Poolhus","Poolterrasse","Indkørsel","Fortov","Privat","Vejlaug","FC Rudersdal","Vedbæk Padel"];
const KATEGORIER = ["El","VVS","Tømrer","Murer","Maler","Have","Brolægning","Rengøring/oprydning","Vedligehold/sæson","Andet"];
const PRIO = {1:"Høj",2:"Normal",3:"Lav"};

/* ======== LAGER (lokal eller Firestore) ======== */
let tasks = [];
let store;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const localStore = {
  name: "Lokal tilstand – gemmer kun i denne browser",
  async init(onChange){
    try{ tasks = JSON.parse(localStorage.getItem("arnevangen-opgaver")||"[]"); }catch(e){ tasks=[]; }
    this.onChange = onChange; onChange();
  },
  persist(){ try{ localStorage.setItem("arnevangen-opgaver", JSON.stringify(tasks)); }catch(e){} this.onChange(); },
  async add(t){ tasks.push(t); this.persist(); },
  async update(id, patch){ const t = tasks.find(x=>x.id===id); if(t) Object.assign(t, patch); this.persist(); },
  async remove(id){ tasks = tasks.filter(x=>x.id!==id); this.persist(); },
};

const fireStore = {
  name: "Firebase",
  async init(onChange){
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js");
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js");
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE);
    this.db = firebase.firestore();
    this.col = this.db.collection(FIREBASE.collection);
    const start = () => this.col.onSnapshot(snap => { tasks = snap.docs.map(d => ({id:d.id, ...d.data()})); onChange(); }, err => toast("Firestore-fejl: " + err.message));
    if (FIREBASE.requireLogin) {
      firebase.auth().onAuthStateChanged(async user => {
        if (!user) { setMode("Ikke logget ind", "<button class='btn' id='login'>Log ind med Google</button>"); document.getElementById("login").onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); return; }
        if (FIREBASE.allowedEmail && user.email !== FIREBASE.allowedEmail) { setMode("Ingen adgang for " + user.email); return; }
        setMode("Firebase", "<b>"+user.email+"</b> · <a href='#' id='logout'>log ud</a>");
        document.getElementById("logout").onclick = e => { e.preventDefault(); firebase.auth().signOut(); };
        start();
      });
    } else { setMode("Firebase", "synkroniserer"); start(); }
  },
  async add(t){ const {id, ...data} = t; await this.col.doc(id).set(data); },
  async update(id, patch){ await this.col.doc(id).update(patch); },
  async remove(id){ await this.col.doc(id).delete(); },
};
function loadScript(src){ return new Promise((res, rej) => { const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Kunne ikke hente "+src)); document.head.appendChild(s); }); }

/* ======== UI-STATE ======== */
const $ = s => document.querySelector(s);
const state = { status:"aaben", sted:"", kat:"", prio_f:"", help:"", sort:"sted", open:null, prio:2, tab:"list" };
function setMode(label, extra){ $("#mode").innerHTML = (extra ? extra + "<br>" : "") + "<span>"+label+"</span>"; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fillSelect(sel, items, placeholder){ sel.innerHTML = (placeholder?`<option value="">${placeholder}</option>`:"") + items.map(i=>`<option value="${esc(i)}">${esc(i)}</option>`).join(""); }
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9æøå]/g,""); }
function matchItem(list, token){ const n=norm(token); return list.find(i=>norm(i)===n) || list.find(i=>norm(i).startsWith(n)) || list.find(i=>norm(i).includes(n)) || null; }

/* Parser: "Male loft @køkken #maler !høj" */
function parseLine(line, defaults){
  let titel = line, sted = defaults.sted, kat = defaults.kat, prio = defaults.prio;
  const re = /([@#!])([^@#!]+)/g; let m;
  while ((m = re.exec(line))) {
    const val = m[2].trim();
    if (m[1]==="@") { const s = matchItem(STEDER, val); if (s) sted = s; }
    if (m[1]==="#") { const k = matchItem(KATEGORIER, val); if (k) kat = k; }
    if (m[1]==="!") { const v = norm(val); prio = v.startsWith("h") ? 1 : v.startsWith("l") ? 3 : 2; }
  }
  titel = line.replace(re, "").replace(/\s{2,}/g," ").trim();
  return { titel, sted, kat, prio };
}
function newTask(p){ return { id: uid(), titel: p.titel, sted: p.sted, kategori: p.kat, prioritet: p.prio, status: "aaben", noter: "", hjaelp: false, frist: "", oprettet: new Date().toISOString(), udfoertDato: "" }; }

async function addFromInput(){
  const raw = $("#newTitle").value.trim(); if(!raw) return;
  const p = parseLine(raw, { sted: $("#newSted").value, kat: $("#newKat").value, prio: state.prio });
  if(!p.titel) return;
  await store.add(newTask(p));
  $("#newTitle").value = ""; $("#newTitle").focus();
  toast("Tilføjet: " + p.titel);
}
async function addBulk(){
  const lines = $("#bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let n=0;
  for (const l of lines) { const p = parseLine(l, { sted: $("#newSted").value, kat: $("#newKat").value, prio: state.prio }); if(p.titel){ await store.add(newTask(p)); n++; } }
  $("#bulk").value=""; toast(n + " opgaver tilføjet");
}

/* ======== RENDER ======== */
function visible(){
  return tasks.filter(t =>
    (state.status==="alle" || t.status===state.status) &&
    (!state.sted || t.sted===state.sted) &&
    (!state.kat || t.kategori===state.kat) &&
    (!state.prio_f || t.prioritet===+state.prio_f) &&
    (!state.help || t.hjaelp));
}
function sortTasks(arr){
  const bySted = (a,b) => STEDER.indexOf(a.sted)-STEDER.indexOf(b.sted) || a.prioritet-b.prioritet || a.titel.localeCompare(b.titel,"da");
  if (state.sort==="prio") return arr.sort((a,b)=>a.prioritet-b.prioritet || bySted(a,b));
  if (state.sort==="frist") return arr.sort((a,b)=>(a.frist||"9")<(b.frist||"9")?-1:(a.frist||"9")>(b.frist||"9")?1:bySted(a,b));
  if (state.sort==="nyeste") return arr.sort((a,b)=>b.oprettet.localeCompare(a.oprettet));
  return arr.sort(bySted);
}
function fmtDateLong(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}-${m}-${y}`; }
function isoLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const dp = { el:null, id:null, view:null, sel:"" };
const MDR=["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
function dpOpen(btn, id){
  dp.el = $("#dp"); dp.id = id; dp.sel = btn.dataset.val || "";
  const base = dp.sel ? new Date(dp.sel+"T00:00") : new Date(); dp.view = new Date(base.getFullYear(), base.getMonth(), 1);
  dpRender();
  const r = btn.getBoundingClientRect(); dp.el.classList.add("show");
  const w = dp.el.offsetWidth, h = dp.el.offsetHeight;
  let left = r.left + window.scrollX, top = r.bottom + window.scrollY + 6;
  if (left + w > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - w - 8;
  if (r.bottom + h + 6 > window.innerHeight && r.top - h - 6 > 0) top = r.top + window.scrollY - h - 6;
  dp.el.style.left = left+"px"; dp.el.style.top = top+"px";
}
function dpClose(){ if(dp.el){ dp.el.classList.remove("show"); dp.id=null; } }
function dpRender(){
  const y=dp.view.getFullYear(), m=dp.view.getMonth(), today=isoLocal(new Date());
  const first=new Date(y,m,1); const offset=(first.getDay()+6)%7; const start=new Date(y,m,1-offset);
  let cells="";
  for(let i=0;i<42;i++){ const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i); const iso=isoLocal(d);
    cells+=`<button type="button" class="d ${d.getMonth()!==m?"out":""} ${iso===today?"today":""} ${iso===dp.sel?"sel":""}" data-iso="${iso}">${d.getDate()}</button>`; }
  dp.el.innerHTML = `<div class="top"><button type="button" data-nav="-1" aria-label="Forrige måned">‹</button><b>${MDR[m]} ${y}</b><button type="button" data-nav="1" aria-label="Næste måned">›</button></div>
    <div class="grid">${["Ma","Ti","On","To","Fr","Lø","Sø"].map(w=>`<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="foot"><button type="button" data-dp="clear">Ryd</button><button type="button" data-dp="today">I dag</button></div>`;
}
async function dpSet(iso){ const id=dp.id; dpClose(); if(id) await store.update(id, { frist: iso }); }
document.addEventListener("click", e => {
  if (!dp.el || !dp.el.classList.contains("show")) return;
  if (dp.el.contains(e.target)) {
    const nav = e.target.closest("[data-nav]"); if (nav) { dp.view.setMonth(dp.view.getMonth()+ +nav.dataset.nav); dpRender(); return; }
    const d = e.target.closest("[data-iso]"); if (d) { dpSet(d.dataset.iso); return; }
    const a = e.target.closest("[data-dp]")?.dataset.dp; if (a==="clear") dpSet(""); if (a==="today") dpSet(isoLocal(new Date()));
    return;
  }
  if (!e.target.closest("[data-act=date]")) dpClose();
});
document.addEventListener("keydown", e => { if (e.key==="Escape") dpClose(); });
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); return d.toLocaleDateString("da-DK",{day:"numeric",month:"short"}); }

/* ======== STATISTIK ======== */
const isoDay = d => d.toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
function ring(pct){ const r=34, c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle class="bg" cx="40" cy="40" r="${r}"/><circle class="fg" cx="40" cy="40" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}"/><text x="40" y="46" text-anchor="middle">${pct}%</text></svg>`; }
function weekChart(weeks){
  const W=600,H=170,pad=26,bw=W/weeks.length, max=Math.max(1,...weeks.flatMap(w=>[w.added,w.done]));
  const y=v=>H-pad-(v/max)*(H-pad-16);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tilføjede og udførte opgaver pr. uge">
    ${weeks.map((w,i)=>{ const x=i*bw; return `
      <rect class="b-add" x="${(x+bw*.14).toFixed(1)}" y="${y(w.added).toFixed(1)}" width="${(bw*.32).toFixed(1)}" height="${(H-pad-y(w.added)).toFixed(1)}" rx="3"/>
      <rect class="b-done" x="${(x+bw*.54).toFixed(1)}" y="${y(w.done).toFixed(1)}" width="${(bw*.32).toFixed(1)}" height="${(H-pad-y(w.done)).toFixed(1)}" rx="3"/>
      ${w.added?`<text class="v" x="${(x+bw*.3).toFixed(1)}" y="${(y(w.added)-4).toFixed(1)}">${w.added}</text>`:""}
      ${w.done?`<text class="v" x="${(x+bw*.7).toFixed(1)}" y="${(y(w.done)-4).toFixed(1)}">${w.done}</text>`:""}
      ${i%2===1?`<text class="l" x="${(x+bw/2).toFixed(1)}" y="${H-8}">${w.label}</text>`:""}`; }).join("")}
    <line class="axis" x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}"/>
  </svg>`;
}
function renderStats(){
  const open = tasks.filter(t=>t.status==="aaben"), done = tasks.filter(t=>t.status==="udfoert");
  const total = tasks.length, pct = total ? Math.round(done.length/total*100) : 0;
  const now = new Date(), today = isoDay(now), in7 = isoDay(new Date(now.getTime()+7*86400000));
  const overdue = open.filter(t=>t.frist && t.frist<today), soon = open.filter(t=>t.frist && t.frist>=today && t.frist<=in7);
  const later = open.filter(t=>t.frist && t.frist>in7), noDue = open.filter(t=>!t.frist);
  const help = open.filter(t=>t.hjaelp);
  const byP = [1,2,3].map(p=>open.filter(t=>t.prioritet===p).length);
  const weight = t => 4-(t.prioritet||2);

  const rooms = STEDER.map(s=>{ const o=open.filter(t=>t.sted===s); return { s, n:o.length, w:o.reduce((a,t)=>a+weight(t),0), done:done.filter(t=>t.sted===s).length }; }).filter(r=>r.n||r.done);
  const maxW = Math.max(1,...rooms.map(r=>r.w));
  const kats = KATEGORIER.map(k=>{ const o=open.filter(t=>t.kategori===k); return { k, n:o.length, h:o.filter(t=>t.prioritet===1).length, help:o.filter(t=>t.hjaelp).length }; }).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const maxK = Math.max(1,...kats.map(x=>x.n));

  const d30 = new Date(now.getTime()-30*86400000).toISOString();
  const done30 = done.filter(t=>t.udfoertDato && t.udfoertDato>=d30).length, added30 = tasks.filter(t=>t.oprettet>=d30).length;
  const lie = done.filter(t=>t.udfoertDato&&t.oprettet).map(t=>daysBetween(t.oprettet,t.udfoertDato));
  const avgLie = lie.length ? Math.round(lie.reduce((a,b)=>a+b,0)/lie.length) : null;
  const perWeek = done30/30*7, etaW = perWeek>0 ? Math.ceil(open.length/perWeek) : null;
  const etaTxt = etaW===null ? "Ingen opgaver udført de sidste 30 dage – svært at spå om tempoet." : etaW<=8 ? `Med det tempo er alle åbne opgaver klaret om ca. <b>${etaW} uge${etaW===1?"":"r"}</b>.` : etaW<=60 ? `Med det tempo er alle åbne opgaver klaret om ca. <b>${Math.round(etaW/4.33)} måneder</b>.` : `Med det tempo tager det <b>over et år</b> at nå bunden af listen.`;
  const oldest = open.slice().sort((a,b)=>a.oprettet.localeCompare(b.oprettet)).slice(0,4);

  const weeks=[]; for(let i=11;i>=0;i--){ const end=new Date(now); end.setHours(23,59,59,999); end.setDate(end.getDate()-i*7); const start=new Date(end); start.setDate(start.getDate()-6); start.setHours(0,0,0,0); const si=start.toISOString(), ei=end.toISOString();
    weeks.push({ label:start.toLocaleDateString("da-DK",{day:"numeric",month:"short"}), added:tasks.filter(t=>t.oprettet>=si&&t.oprettet<=ei).length, done:done.filter(t=>t.udfoertDato>=si&&t.udfoertDato<=ei).length }); }

  const pBar = open.length ? byP.map((n,i)=>n?`<i style="width:${n/open.length*100}%;background:var(--p${i+1})" title="${PRIO[i+1]}: ${n}"></i>`:"").join("") : "";

  $("#stats").innerHTML = !total ? `<div class="empty">Ingen opgaver endnu – statistikken kommer, når listen gør.</div>` : `
    <div class="kpis">
      <div class="kpi"><b>${open.length}</b><span>Åbne</span></div>
      <div class="kpi"><b>${done.length}</b><span>Udførte</span></div>
      <div class="kpi">${ring(pct)}<span>Fuldført</span></div>
      <div class="kpi ${overdue.length?"bad":""}"><b>${overdue.length}</b><span>Forfaldne</span></div>
      <div class="kpi"><b>${help.length}</b><span>Kræver hjælp</span></div>
    </div>
    <div class="cards">
      <div class="card"><h3>Prioritet – åbne opgaver</h3>
        ${open.length?`<div class="stack">${pBar}</div><div class="legend"><span style="--c:var(--p1)">Høj ${byP[0]}</span><span style="--c:var(--p2)">Normal ${byP[1]}</span><span style="--c:var(--p3)">Lav ${byP[2]}</span></div>`:`<p class="muted">Alt er klaret. Flot.</p>`}
      </div>
      <div class="card"><h3>Frister</h3>
        <div class="kv">
          <div><span>Forfaldne</span><b class="${overdue.length?"bad":""}">${overdue.length}</b></div>
          <div><span>Inden for 7 dage</span><b>${soon.length}</b></div>
          <div><span>Senere</span><b>${later.length}</b></div>
          <div><span>Uden frist</span><b>${noDue.length}</b></div>
        </div>
      </div>
      <div class="card wide"><h3>Husets varmekort</h3><p class="sub">Jo kraftigere farve, jo mere trænger rummet – antal åbne opgaver vægtet efter prioritet. Tryk på et rum for at se opgaverne.</p>
        <div class="tiles">${rooms.sort((a,b)=>b.w-a.w||a.s.localeCompare(b.s,"da")).map(r=>`
          <button class="tile ${r.n?"":"clear"}" data-sted="${esc(r.s)}" style="${r.n?`background:color-mix(in srgb,var(--p1) ${Math.round(8+52*r.w/maxW)}%,var(--surface-2))`:""}"><b>${esc(r.s)}</b><span>${r.n?`${r.n} åben${r.n===1?"":"e"}`:"alt klaret ✓"}</span></button>`).join("")}
        </div>
      </div>
      <div class="card wide"><h3>Hvem skal du have fat i?</h3><p class="sub">Åbne opgaver pr. kategori – godt til at samle opgaver, inden du ringer til håndværkeren. Tryk for at se listen.</p>
        ${kats.length?`<div class="hbars">${kats.map(x=>`<button class="hbar" data-kat="${esc(x.k)}"><span>${esc(x.k)}</span><span class="bar"><i style="width:${x.n/maxK*100}%"></i></span><small><b>${x.n}</b>${x.h?` · ${x.h} høj`:""}${x.help?` · ${x.help} m. hjælp`:""}</small></button>`).join("")}</div>`:`<p class="muted">Ingen åbne opgaver.</p>`}
      </div>
      <div class="card"><h3>Tempo</h3>
        <div class="kv">
          <div><span>Udført sidste 30 dage</span><b>${done30}</b></div>
          <div><span>Tilføjet sidste 30 dage</span><b>${added30}</b></div>
          <div><span>Gns. liggetid (oprettet → udført)</span><b>${avgLie===null?"–":avgLie+" dage"}</b></div>
        </div>
        <p class="muted" style="margin:12px 0 0">${etaTxt}</p>
      </div>
      <div class="card"><h3>Støvsamlere – ældste åbne</h3>
        ${oldest.length?`<div class="old">${oldest.map(t=>`<div><span><i class="dot" style="--c:var(--p${t.prioritet})"></i>${esc(t.titel)}</span><small>${daysBetween(t.oprettet,now)} dage</small></div>`).join("")}</div>`:`<p class="muted">Ingen åbne opgaver.</p>`}
      </div>
      <div class="card wide"><h3>Aktivitet – sidste 12 uger</h3>
        ${weekChart(weeks)}
        <div class="legend"><span style="--c:var(--sage)">Tilføjet</span><span style="--c:var(--accent)">Udført</span></div>
      </div>
    </div>`;
}
function setTab(tab){ state.tab = tab; document.body.dataset.tab = tab; [...$("#tabs").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.tab===tab)); }
function showList(filter){
  state.status="aaben"; state.sted=filter.sted||""; state.kat=filter.kat||""; state.prio_f=""; state.help="";
  $("#fSted").value=state.sted; $("#fKat").value=state.kat; $("#fPrio").value=""; $("#fHelp").value="";
  [...$("#statusSeg").children].forEach(x=>x.setAttribute("aria-pressed", x.dataset.s==="aaben"));
  setTab("list"); render(); window.scrollTo({top:0,behavior:"smooth"});
}

$("#list").addEventListener("click", async e => {
  const art = e.target.closest(".task"); if(!art) return; const id = art.dataset.id;
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act==="toggle") { const t = tasks.find(x=>x.id===id); const done = t.status!=="udfoert"; await store.update(id, { status: done?"udfoert":"aaben", udfoertDato: done?new Date().toISOString():"" }); toast(done?"Udført":"Åbnet igen"); return; }
  if (act==="date") { const b=e.target.closest("[data-act=date]"); if (dp.id===id && $("#dp").classList.contains("show")) dpClose(); else dpOpen(b, id); return; }
  if (act==="dateclear") { await store.update(id, { frist: "" }); return; }
  if (act==="delete") { if (confirm("Slet opgaven?")) { await store.remove(id); state.open=null; } return; }
  if (e.target.closest(".head")) { state.open = state.open===id ? null : id; render(); }
});
$("#list").addEventListener("change", async e => {
  const f = e.target.dataset.f; if(!f) return; const id = e.target.closest(".task").dataset.id;
  let v = e.target.type==="checkbox" ? e.target.checked : e.target.value; if (f==="prioritet") v = +v;
  await store.update(id, { [f]: v });
});

fillSelect($("#newSted"), STEDER); fillSelect($("#newKat"), KATEGORIER);
fillSelect($("#fSted"), STEDER, "Alle steder"); fillSelect($("#fKat"), KATEGORIER, "Alle kategorier");
$("#newSted").value = "Entré"; $("#newKat").value = "Andet";
store = FIREBASE.apiKey ? fireStore : localStore;
setMode(store.name);
store.init(render).catch(err => { setMode("Fejl: " + err.message); toast(err.message); });
