<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnevangen 35 – opgaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --moss:#1C3A2A; --leaf:#3E7D4F; --fern:#5E9B6B; --sage:#B9D4B2; --mist:#EEF4EA; --paper:#FFFFFF;
  --bg:var(--mist); --surface:var(--paper); --surface-2:#F6F9F3; --line:#D6E3D1;
  --text:var(--moss); --text-2:#587060; --accent:var(--leaf); --accent-ink:#FFFFFF;
  --warn:#C77B2B; --done:#8EA893;
  --r:14px; --r-s:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#101A14; --surface:#172419; --surface-2:#1E2D22; --line:#2B3F31;
  --text:#E6EFE3; --text-2:#9DB3A3; --accent:#6DB37D; --accent-ink:#0E1A12; --sage:#2E4A38; --done:#5C7363;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101A14; --surface:#172419; --surface-2:#1E2D22; --line:#2B3F31;
  --text:#E6EFE3; --text-2:#9DB3A3; --accent:#6DB37D; --accent-ink:#0E1A12; --sage:#2E4A38; --done:#5C7363;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
header h1 small{display:block;font-size:14px;font-weight:600;color:var(--text-2)}
.mode{font-size:13px;color:var(--text-2);text-align:right;white-space:nowrap}
.mode b{color:var(--accent)}

/* Hurtig tilføjelse */
.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:18px;box-shadow:0 1px 0 rgba(28,58,42,.04)}
.add .row{display:flex;gap:8px}
.add input[type=text]{flex:1;border:0;background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;font-size:17px;font-weight:600;min-width:0}
.add input[type=text]:focus{outline:2px solid var(--accent);outline-offset:0}
.add .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.add select,.add .prio{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.add .prio{display:inline-flex;gap:0;padding:0;overflow:hidden}
.add .prio button{border:0;background:none;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--text-2)}
.add .prio button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.add .hint{font-size:13px;color:var(--text-2);margin-left:auto}
.add .hint code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
textarea#bulk{display:none;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px;min-height:110px;background:var(--surface-2);resize:vertical}
.add.bulk textarea#bulk{display:block}
.add.bulk .row{display:none}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-s);padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Filtre */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-2)}
.seg button[aria-pressed=true]{background:var(--sage);color:var(--text)}
.count{margin-left:auto;font-size:13px;color:var(--text-2)}

/* Liste */
.group{margin-bottom:22px}
.group h2{font-size:14px;font-weight:800;color:var(--text-2);margin:0 0 6px 4px;display:flex;justify-content:space-between}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.task .head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.task .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--fern);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.task.done .check{background:var(--done);border-color:var(--done)}
.task .check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.task.done .check svg{opacity:1}
.task .title{font-weight:700;min-width:0;overflow-wrap:anywhere}
.task.done .title{color:var(--text-2);text-decoration:line-through;text-decoration-color:var(--done)}
.task .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-2);flex-wrap:wrap;justify-content:flex-end}
.tag{border-radius:999px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.help{background:#FFF1E2;border-color:#F0C9A0;color:var(--warn);font-weight:700}
.tag.p1{border-color:var(--accent);color:var(--accent);font-weight:700}
.tag.note::before{content:"✎ "}
.task .body{display:none;padding:0 12px 12px;border-top:1px dashed var(--line);background:var(--surface-2)}
.task.open .body{display:block}
.body .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.body label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:4px}
.body select,.body input,.body textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface)}
.body textarea{min-height:80px;resize:vertical;grid-column:1/-1}
.body .chk{display:flex;align-items:center;gap:8px;grid-column:1/-1;font-weight:600}
.body .chk input{width:auto}
.body .actions{display:flex;gap:8px;margin-top:10px;justify-content:space-between}
.body .danger{background:none;border:0;color:var(--warn);cursor:pointer;font-weight:600}
.empty{padding:40px 12px;text-align:center;color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--moss);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:520px){ .task .head{grid-template-columns:auto 1fr} .task .meta{grid-column:2;justify-content:flex-start} .body .grid{grid-template-columns:1fr} header{flex-direction:column;align-items:flex-start} .mode{text-align:left} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Arnevangen 35<small>Opgaver i huset</small></h1>
    <div class="mode" id="mode"></div>
  </header>

  <section class="add" id="add" aria-label="Ny opgave">
    <div class="row">
      <input type="text" id="newTitle" placeholder="Ny opgave – fx: Male loft @køkken #maler !høj" autocomplete="off">
      <button class="btn" id="addBtn">Tilføj</button>
    </div>
    <textarea id="bulk" placeholder="Én opgave pr. linje. Samme @sted, #kategori og !prio-koder virker på hver linje.&#10;Male loft @køkken #maler&#10;Skifte pakning i bruser @bad soveværelse #vvs"></textarea>
    <div class="opts">
      <select id="newSted" aria-label="Sted"></select>
      <select id="newKat" aria-label="Kategori"></select>
      <div class="prio" id="newPrio" role="group" aria-label="Prioritet">
        <button data-p="1" aria-pressed="false">Høj</button><button data-p="2" aria-pressed="true">Normal</button><button data-p="3" aria-pressed="false">Lav</button>
      </div>
      <button class="btn ghost" id="bulkToggle">Flere ad gangen</button>
      <button class="btn" id="bulkAdd" style="display:none">Tilføj alle</button>
      <span class="hint">Enter tilføjer · <code>@sted</code> <code>#kategori</code> <code>!høj</code></span>
    </div>
  </section>

  <div class="filters">
    <div class="seg" id="statusSeg"><button data-s="aaben" aria-pressed="true">Åbne</button><button data-s="udfoert" aria-pressed="false">Udførte</button><button data-s="alle" aria-pressed="false">Alle</button></div>
    <select id="fSted"><option value="">Alle steder</option></select>
    <select id="fKat"><option value="">Alle kategorier</option></select>
    <select id="fHelp"><option value="">Alle</option><option value="1">Kræver hjælp</option></select>
    <select id="sortBy"><option value="sted">Sortér: sted</option><option value="prio">Sortér: prioritet</option><option value="frist">Sortér: frist</option><option value="nyeste">Sortér: nyeste</option></select>
    <span class="count" id="count"></span>
  </div>

  <main id="list"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
/* Konfiguration ligger i config.js (window.FIREBASE). Mangler filen, eller er apiKey tom, kører appen i lokal tilstand. */
const FIREBASE = Object.assign({ apiKey: "", collection: "opgaver", requireLogin: true, allowedEmail: "" }, window.FIREBASE || {});

const STEDER = ["Entré","Gang","Alrum","Køkken","Stue","Trappe","Repos","Bryggers","Soveværelse","Bad soveværelse","Carls værelse","Frederiks værelse","Bad Frederik","Gæsteværelse","Williams værelse","Bad William","Hobbyrum","Garage","Terrasse tag","Terrasse","Pool","Poolhus","Poolterrasse","Indkørsel","Vej"];
const KATEGORIER = ["El","VVS","Tømrer","Murer","Maler","Have","Brolægning","Rengøring/oprydning","Vedligehold/sæson","Andet"];
const PRIO = {1:"Høj",2:"Normal",3:"Lav"};

/* ======== LAGER (lokal eller Firestore) ======== */
let tasks = [];
let store;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const localStore = {
  name: "Lokal tilstand – gemmer kun i denne browser",
  async init(onChange){
    try{ tasks = JSON.parse(localStorage.getItem("arnevangen-opgaver")||"[]"); }catch(e){ tasks=[]; }
    this.onChange = onChange; onChange();
  },
  persist(){ try{ localStorage.setItem("arnevangen-opgaver", JSON.stringify(tasks)); }catch(e){} this.onChange(); },
  async add(t){ tasks.push(t); this.persist(); },
  async update(id, patch){ const t = tasks.find(x=>x.id===id); if(t) Object.assign(t, patch); this.persist(); },
  async remove(id){ tasks = tasks.filter(x=>x.id!==id); this.persist(); },
};

const fireStore = {
  name: "Firebase",
  async init(onChange){
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js");
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js");
    await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE);
    this.db = firebase.firestore();
    this.col = this.db.collection(FIREBASE.collection);
    const start = () => this.col.onSnapshot(snap => { tasks = snap.docs.map(d => ({id:d.id, ...d.data()})); onChange(); }, err => toast("Firestore-fejl: " + err.message));
    if (FIREBASE.requireLogin) {
      firebase.auth().onAuthStateChanged(async user => {
        if (!user) { setMode("Ikke logget ind", "<button class='btn' id='login'>Log ind med Google</button>"); document.getElementById("login").onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); return; }
        if (FIREBASE.allowedEmail && user.email !== FIREBASE.allowedEmail) { setMode("Ingen adgang for " + user.email); return; }
        setMode("Firebase", "<b>"+user.email+"</b> · <a href='#' id='logout'>log ud</a>");
        document.getElementById("logout").onclick = e => { e.preventDefault(); firebase.auth().signOut(); };
        start();
      });
    } else { setMode("Firebase", "synkroniserer"); start(); }
  },
  async add(t){ const {id, ...data} = t; await this.col.doc(id).set(data); },
  async update(id, patch){ await this.col.doc(id).update(patch); },
  async remove(id){ await this.col.doc(id).delete(); },
};
function loadScript(src){ return new Promise((res, rej) => { const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Kunne ikke hente "+src)); document.head.appendChild(s); }); }

/* ======== UI-STATE ======== */
const $ = s => document.querySelector(s);
const state = { status:"aaben", sted:"", kat:"", help:"", sort:"sted", open:null, prio:2 };
function setMode(label, extra){ $("#mode").innerHTML = (extra ? extra + "<br>" : "") + "<span>"+label+"</span>"; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fillSelect(sel, items, placeholder){ sel.innerHTML = (placeholder?`<option value="">${placeholder}</option>`:"") + items.map(i=>`<option value="${esc(i)}">${esc(i)}</option>`).join(""); }
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9æøå]/g,""); }
function matchItem(list, token){ const n=norm(token); return list.find(i=>norm(i)===n) || list.find(i=>norm(i).startsWith(n)) || list.find(i=>norm(i).includes(n)) || null; }

/* Parser: "Male loft @køkken #maler !høj" */
function parseLine(line, defaults){
  let titel = line, sted = defaults.sted, kat = defaults.kat, prio = defaults.prio;
  const re = /([@#!])([^@#!]+)/g; let m;
  while ((m = re.exec(line))) {
    const val = m[2].trim();
    if (m[1]==="@") { const s = matchItem(STEDER, val); if (s) sted = s; }
    if (m[1]==="#") { const k = matchItem(KATEGORIER, val); if (k) kat = k; }
    if (m[1]==="!") { const v = norm(val); prio = v.startsWith("h") ? 1 : v.startsWith("l") ? 3 : 2; }
  }
  titel = line.replace(re, "").replace(/\s{2,}/g," ").trim();
  return { titel, sted, kat, prio };
}
function newTask(p){ return { id: uid(), titel: p.titel, sted: p.sted, kategori: p.kat, prioritet: p.prio, status: "aaben", noter: "", hjaelp: false, frist: "", oprettet: new Date().toISOString(), udfoertDato: "" }; }

async function addFromInput(){
  const raw = $("#newTitle").value.trim(); if(!raw) return;
  const p = parseLine(raw, { sted: $("#newSted").value, kat: $("#newKat").value, prio: state.prio });
  if(!p.titel) return;
  await store.add(newTask(p));
  $("#newTitle").value = ""; $("#newTitle").focus();
  toast("Tilføjet: " + p.titel);
}
async function addBulk(){
  const lines = $("#bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let n=0;
  for (const l of lines) { const p = parseLine(l, { sted: $("#newSted").value, kat: $("#newKat").value, prio: state.prio }); if(p.titel){ await store.add(newTask(p)); n++; } }
  $("#bulk").value=""; toast(n + " opgaver tilføjet");
}

/* ======== RENDER ======== */
function visible(){
  return tasks.filter(t =>
    (state.status==="alle" || t.status===state.status) &&
    (!state.sted || t.sted===state.sted) &&
    (!state.kat || t.kategori===state.kat) &&
    (!state.help || t.hjaelp));
}
function sortTasks(arr){
  const bySted = (a,b) => STEDER.indexOf(a.sted)-STEDER.indexOf(b.sted) || a.prioritet-b.prioritet || a.titel.localeCompare(b.titel,"da");
  if (state.sort==="prio") return arr.sort((a,b)=>a.prioritet-b.prioritet || bySted(a,b));
  if (state.sort==="frist") return arr.sort((a,b)=>(a.frist||"9")<(b.frist||"9")?-1:(a.frist||"9")>(b.frist||"9")?1:bySted(a,b));
  if (state.sort==="nyeste") return arr.sort((a,b)=>b.oprettet.localeCompare(a.oprettet));
  return arr.sort(bySted);
}
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); return d.toLocaleDateString("da-DK",{day:"numeric",month:"short"}); }
function render(){
  const list = sortTasks(visible());
  const openCount = tasks.filter(t=>t.status==="aaben").length;
  $("#count").textContent = `${list.length} vist · ${openCount} åbne i alt`;
  if (!list.length) { $("#list").innerHTML = `<div class="empty">${tasks.length ? "Ingen opgaver matcher filtrene." : "Ingen opgaver endnu – skriv den første i feltet ovenfor."}</div>`; return; }
  const groups = {}; const key = t => state.sort==="sted" ? (t.sted||"Uden sted") : state.sort==="prio" ? PRIO[t.prioritet] : state.sort==="frist" ? (t.frist ? "Frist " + fmtDate(t.frist) : "Uden frist") : "Opgaver";
  for (const t of list) (groups[key(t)] ||= []).push(t);
  $("#list").innerHTML = Object.entries(groups).map(([g, items]) => `
    <section class="group"><h2><span>${esc(g)}</span><span>${items.length}</span></h2>
    ${items.map(t => `
      <article class="task ${t.status==="udfoert"?"done":""} ${state.open===t.id?"open":""}" data-id="${t.id}">
        <div class="head">
          <button class="check" data-act="toggle" aria-label="Markér som ${t.status==="udfoert"?"åben":"udført"}"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg></button>
          <div class="title">${esc(t.titel)}</div>
          <div class="meta">
            ${t.hjaelp?`<span class="tag help">Kræver hjælp</span>`:""}
            ${t.prioritet===1?`<span class="tag p1">Høj</span>`:t.prioritet===3?`<span class="tag">Lav</span>`:""}
            ${state.sort!=="sted"&&t.sted?`<span class="tag">${esc(t.sted)}</span>`:""}
            ${t.kategori?`<span class="tag">${esc(t.kategori)}</span>`:""}
            ${t.frist&&state.sort!=="frist"?`<span class="tag">${fmtDate(t.frist)}</span>`:""}
            ${t.noter?`<span class="tag note">note</span>`:""}
          </div>
        </div>
        <div class="body">
          <div class="grid">
            <div><label>Opgave</label><input data-f="titel" value="${esc(t.titel)}"></div>
            <div><label>Frist</label><input type="date" data-f="frist" value="${esc(t.frist)}"></div>
            <div><label>Sted</label><select data-f="sted">${STEDER.map(s=>`<option ${s===t.sted?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
            <div><label>Kategori</label><select data-f="kategori">${KATEGORIER.map(k=>`<option ${k===t.kategori?"selected":""}>${esc(k)}</option>`).join("")}</select></div>
            <div><label>Prioritet</label><select data-f="prioritet">${[1,2,3].map(p=>`<option value="${p}" ${p===t.prioritet?"selected":""}>${PRIO[p]}</option>`).join("")}</select></div>
            <label class="chk"><input type="checkbox" data-f="hjaelp" ${t.hjaelp?"checked":""}> Kræver hjælp fra andre</label>
            <textarea data-f="noter" placeholder="Noter – fx hvem der skal hjælpe, materialer, mål, hvad der er prøvet…">${esc(t.noter)}</textarea>
          </div>
          <div class="actions">
            <button class="danger" data-act="delete">Slet opgave</button>
            <span style="font-size:12px;color:var(--text-2)">Oprettet ${fmtDate(t.oprettet)}${t.udfoertDato?" · udført "+fmtDate(t.udfoertDato):""}</span>
          </div>
        </div>
      </article>`).join("")}
    </section>`).join("");
}

/* ======== EVENTS ======== */
$("#addBtn").onclick = addFromInput;
$("#newTitle").addEventListener("keydown", e => { if (e.key==="Enter") addFromInput(); });
$("#bulkToggle").onclick = () => { const on = $("#add").classList.toggle("bulk"); $("#bulkAdd").style.display = on?"":"none"; $("#bulkToggle").textContent = on ? "Én ad gangen" : "Flere ad gangen"; (on?$("#bulk"):$("#newTitle")).focus(); };
$("#bulkAdd").onclick = addBulk;
$("#newPrio").onclick = e => { const b = e.target.closest("button"); if(!b) return; state.prio = +b.dataset.p; [...$("#newPrio").children].forEach(x=>x.setAttribute("aria-pressed", x===b)); };
$("#statusSeg").onclick = e => { const b = e.target.closest("button"); if(!b) return; state.status = b.dataset.s; [...$("#statusSeg").children].forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); };
$("#fSted").onchange = e => { state.sted = e.target.value; render(); };
$("#fKat").onchange = e => { state.kat = e.target.value; render(); };
$("#fHelp").onchange = e => { state.help = e.target.value; render(); };
$("#sortBy").onchange = e => { state.sort = e.target.value; render(); };

$("#list").addEventListener("click", async e => {
  const art = e.target.closest(".task"); if(!art) return; const id = art.dataset.id;
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act==="toggle") { const t = tasks.find(x=>x.id===id); const done = t.status!=="udfoert"; await store.update(id, { status: done?"udfoert":"aaben", udfoertDato: done?new Date().toISOString():"" }); toast(done?"Udført":"Åbnet igen"); return; }
  if (act==="delete") { if (confirm("Slet opgaven?")) { await store.remove(id); state.open=null; } return; }
  if (e.target.closest(".head")) { state.open = state.open===id ? null : id; render(); }
});
$("#list").addEventListener("change", async e => {
  const f = e.target.dataset.f; if(!f) return; const id = e.target.closest(".task").dataset.id;
  let v = e.target.type==="checkbox" ? e.target.checked : e.target.value; if (f==="prioritet") v = +v;
  await store.update(id, { [f]: v });
});

fillSelect($("#newSted"), STEDER); fillSelect($("#newKat"), KATEGORIER);
fillSelect($("#fSted"), STEDER, "Alle steder"); fillSelect($("#fKat"), KATEGORIER, "Alle kategorier");
$("#newSted").value = "Entré"; $("#newKat").value = "Andet";
store = FIREBASE.apiKey ? fireStore : localStore;
setMode(store.name);
store.init(render).catch(err => { setMode("Fejl: " + err.message); toast(err.message); });
</script>
